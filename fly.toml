# Fly.io app config for Artel (Laravel API + SQLite).
# Create the app/volume once, then: fly deploy

app = "artel-c14"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  APP_URL = "https://artel-c14.fly.dev"
  DB_CONNECTION = "sqlite"
  DB_DATABASE = "/data/database.sqlite"
  PORT = "8080"
  LOG_CHANNEL = "stderr"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/up"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "artel_data"
  destination = "/data"
  initial_size = "1gb"
