site_name: Artel
site_description: Documentação técnica do Artel, aplicação de divisão de despesas em grupo.
docs_dir: docs
site_dir: site

# Arquivos locais em docs/ que não fazem parte do site publicado
exclude_docs: |
  diagnostico.md

theme:
  name: material
  language: pt-BR
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Mudar para o modo escuro
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Mudar para o modo claro

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Visão geral: index.md
  - Instalação e execução: instalacao.md
  - Como rodar o projeto / Comandos Úteis: comandos.md
  - Arquitetura: arquitetura.md
  - API: api.md
  - Testes: testes.md
  - Decisões arquiteturais: decisoes.md
  - Documentação (MkDocs): documentacao.md
