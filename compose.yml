services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: artel-app
        ports:
            - "8000:8080"
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: http://localhost:8000
            DB_CONNECTION: sqlite
            DB_DATABASE: /data/database.sqlite
            PORT: "8080"
        volumes:
            - artel_sqlite:/data
        restart: unless-stopped

volumes:
    artel_sqlite:
